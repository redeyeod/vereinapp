<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VereinsManager</title>
    
    <!-- 1. Externe Bibliotheken -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind Konfiguration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        dark: { 
                            bg: '#0f172a', 
                            card: '#1e293b', 
                            hover: '#334155', 
                            border: '#334155', 
                            text: '#f8fafc', 
                            muted: '#94a3b8' 
                        },
                        brand: {
                            500: '#3b82f6',
                            600: '#2563eb',
                            glow: 'rgba(59, 130, 246, 0.5)'
                        }
                    },
                    borderRadius: { 'xl': '1rem', '2xl': '1.5rem' },
                    boxShadow: {
                        'glow': '0 0 20px rgba(59, 130, 246, 0.15)'
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Modern Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Utilities */
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        
        /* Toast */
        #toast { visibility: hidden; min-width: 280px; background-color: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 99px; padding: 12px 24px; position: fixed; z-index: 100; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; box-shadow: 0 10px 30px -5px rgba(0,0,0,0.3); }
        #toast.show { visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0); }

        /* --- LIQUID BUBBLE FOOTER ANIMATION --- */
        #nav-glider {
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            transform: translateX(0); /* Default: Links (App) */
        }
        
        /* Wenn Chat-Modus aktiv ist: Schiebe Bubble nach rechts */
        #mobile-bottom-nav.chat-mode #nav-glider {
            transform: translateX(100%);
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(37, 99, 235, 0.2));
            border-color: rgba(59, 130, 246, 0.4);
        }

        /* Icon Animationen */
        #mobile-bottom-nav i { transition: transform 0.3s ease; }
        
        /* Aktiver State Farben */
        #mobile-bottom-nav:not(.chat-mode) #footer-btn-app { color: #fff; text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        #mobile-bottom-nav:not(.chat-mode) #footer-btn-app i { transform: scale(1.1); }
        #mobile-bottom-nav:not(.chat-mode) #footer-btn-chat { color: #64748b; }

        #mobile-bottom-nav.chat-mode #footer-btn-chat { color: #fff; text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        #mobile-bottom-nav.chat-mode #footer-btn-chat i { transform: scale(1.1); }
        #mobile-bottom-nav.chat-mode #footer-btn-app { color: #64748b; }

        /* FORCE FOOTER SIZE CONSISTENCY */
        #mobile-bottom-nav {
            height: 72px !important;
            width: 92% !important;
            max-width: 400px !important;
        }
    </style>
</head>
<body class="bg-dark-bg text-dark-text antialiased selection:bg-brand-500/30 selection:text-brand-500 overflow-hidden">

    <!-- AUTH VIEW (LOGIN) -->
    <div id="auth-view" class="h-screen w-full flex items-center justify-center p-4 relative overflow-hidden">
        <!-- Background Elements -->
        <div class="absolute inset-0 z-0">
            <div class="absolute top-0 left-0 w-full h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-blue-900/20 via-dark-bg to-dark-bg"></div>
            <div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-brand-500/10 rounded-full blur-3xl"></div>
            <div class="absolute bottom-[-10%] left-[-5%] w-72 h-72 bg-indigo-500/10 rounded-full blur-3xl"></div>
        </div>

        <div class="relative z-10 w-full max-w-sm glass p-8 rounded-2xl shadow-2xl fade-in border border-white/5">
            <div class="text-center mb-8">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-brand-500 to-indigo-600 flex items-center justify-center text-3xl text-white shadow-glow mx-auto mb-5 rotate-3 transform hover:rotate-6 transition-transform">
                    <i class="fa-solid fa-users-rectangle"></i>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Willkommen zurück</h1>
                <p class="text-dark-muted text-sm mt-2">Melde dich an, um fortzufahren.</p>
            </div>
            
            <form id="login-form" onsubmit="event.preventDefault(); if(typeof App !== 'undefined') { App.handleLogin(event); } else { alert('App lädt noch...'); } return false;" class="space-y-4">
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-dark-muted uppercase tracking-wider ml-1">E-Mail</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-dark-muted/50"></i>
                        <input type="email" name="email" required placeholder="name@verein.de" class="w-full bg-dark-bg/50 border border-dark-border rounded-xl pl-11 pr-4 py-3 text-white focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all placeholder-dark-muted/30">
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-dark-muted uppercase tracking-wider ml-1">Passwort</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-dark-muted/50"></i>
                        <input type="password" name="password" required placeholder="••••••••" class="w-full bg-dark-bg/50 border border-dark-border rounded-xl pl-11 pr-4 py-3 text-white focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all placeholder-dark-muted/30">
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3.5 rounded-xl transition-all shadow-glow mt-4 flex items-center justify-center gap-2 group">
                    <span>Anmelden</span>
                    <i class="fa-solid fa-arrow-right text-sm opacity-70 group-hover:translate-x-1 transition-transform"></i>
                </button>
            </form>
            <div id="login-error" class="text-red-400 text-xs text-center mt-4 hidden bg-red-500/10 py-2 rounded-lg border border-red-500/20"></div>
        </div>
    </div>

    <!-- APP VIEW -->
    <div id="app-view" class="h-screen flex flex-col overflow-hidden hidden bg-dark-bg">
        
        <!-- HEADER (MODERN GLASS DESIGN) -->
        <header id="main-header" class="h-20 bg-dark-bg/60 backdrop-blur-xl border-b border-white/5 flex items-center justify-between px-6 z-30 sticky top-0 transition-transform duration-500 ease-in-out">
            <!-- Logo Area -->
            <button onclick="if(typeof App !== 'undefined') App.router('dashboard')" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-lg group-hover:shadow-brand-500/30 transition-all duration-300">
                    <i class="fa-solid fa-users-rectangle text-lg"></i>
                </div>
                <div class="text-left hidden sm:block">
                    <h1 class="text-lg font-bold text-white tracking-tight leading-none group-hover:text-brand-500 transition-colors">VereinApp</h1>
                    <p id="page-subtitle" class="text-[10px] text-dark-muted font-bold uppercase tracking-widest mt-0.5">Manager</p>
                </div>
            </button>

            <!-- Desktop Nav (Pill Style) -->
            <nav class="hidden md:flex items-center gap-1 bg-dark-card/50 p-1.5 rounded-full border border-white/5 backdrop-blur-md shadow-xl">
                <button onclick="App.router('dashboard')" class="w-12 h-10 rounded-full flex items-center justify-center text-dark-muted hover:text-white hover:bg-white/5 transition-all relative group border border-transparent" title="Dashboard">
                    <i class="fa-solid fa-house"></i>
                </button>
                <div class="w-px h-5 bg-white/10 mx-1"></div>
                
                <button onclick="App.router('members')" class="w-12 h-10 rounded-full flex items-center justify-center text-dark-muted hover:text-white hover:bg-white/5 transition-all border border-transparent" title="Mitglieder">
                    <i class="fa-solid fa-users"></i>
                </button>
                <button onclick="App.router('groups')" class="w-12 h-10 rounded-full flex items-center justify-center text-dark-muted hover:text-white hover:bg-white/5 transition-all border border-transparent" title="Gruppen">
                    <i class="fa-solid fa-layer-group"></i>
                </button>
                <button onclick="App.router('calendar')" class="w-12 h-10 rounded-full flex items-center justify-center text-dark-muted hover:text-white hover:bg-white/5 transition-all border border-transparent" title="Kalender">
                    <i class="fa-solid fa-calendar"></i>
                </button>
                <button onclick="App.router('news')" class="w-12 h-10 rounded-full flex items-center justify-center text-dark-muted hover:text-white hover:bg-white/5 transition-all border border-transparent" title="News">
                    <i class="fa-solid fa-newspaper"></i>
                </button>
                <button onclick="App.router('messenger')" class="w-12 h-10 rounded-full flex items-center justify-center text-dark-muted hover:text-white hover:bg-white/5 transition-all border border-transparent relative" title="Messenger">
                    <i class="fa-solid fa-comments"></i>
                </button>
                
                <!-- Admin Button (Hidden by default) -->
                <button id="nav-btn-roles" onclick="App.router('admin_roles')" class="w-12 h-10 rounded-full flex items-center justify-center text-dark-muted hover:text-brand-500 hover:bg-brand-500/10 transition-all border border-transparent hidden" title="Admin">
                    <i class="fa-solid fa-shield-halved"></i>
                </button>
            </nav>

            <!-- Right Area -->
            <div class="flex items-center gap-5">
                <!-- Desktop Profile -->
                <button onclick="App.router('profile')" class="hidden md:flex items-center gap-3 pl-5 border-l border-white/5 group">
                    <div class="text-right">
                        <p id="current-user-name" class="text-sm font-bold text-white group-hover:text-brand-500 transition-colors">Laden...</p>
                        <p id="current-user-role" class="text-[10px] text-dark-muted uppercase font-bold tracking-wider">...</p>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-dark-card border border-white/10 flex items-center justify-center group-hover:border-brand-500 transition-all shadow-lg overflow-hidden">
                        <i class="fa-solid fa-user text-dark-muted group-hover:text-brand-500 transition-colors"></i>
                    </div>
                </button>

                <!-- Mobile Menu Button -->
                <button onclick="App.toggleMobileMenu()" class="md:hidden w-11 h-11 rounded-xl bg-dark-card border border-white/5 text-white flex items-center justify-center active:scale-95 transition-transform shadow-lg">
                    <i class="fa-solid fa-bars-staggered"></i>
                </button>
            </div>
        </header>

        <!-- CONTENT -->
        <main id="content" class="flex-1 overflow-y-auto overflow-x-hidden p-4 md:p-8 pb-28 scroll-smooth w-full relative">
            <!-- Views werden hier geladen -->
        </main>

        <!-- MOBILE BOTTOM FOOTER (Floating Liquid Bubbles) -->
        <!-- Forced Height [72px] for consistent look -->
        <div id="mobile-bottom-nav" class="md:hidden fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-[400px] h-[72px] bg-[#0f172a]/80 backdrop-blur-2xl border border-white/10 rounded-full flex items-center p-1.5 z-[100] shadow-[0_8px_32px_rgba(0,0,0,0.5)] ring-1 ring-white/5 safe-bottom overflow-hidden relative">
            
            <!-- The SWIPE Glider Background -->
            <div id="nav-glider" class="absolute left-1.5 top-1.5 bottom-1.5 w-[calc(50%-6px)] bg-gradient-to-br from-brand-600 to-indigo-600 rounded-full shadow-[0_0_15px_rgba(59,130,246,0.4)] z-0 border border-white/10"></div>

            <!-- App Button -->
            <button id="footer-btn-app" onclick="App.router('dashboard')" class="flex-1 h-full rounded-full flex flex-col items-center justify-center gap-1 transition-all duration-300 relative z-10 group cursor-pointer">
                <i class="fa-solid fa-layer-group text-xl mb-1 transition-transform group-active:scale-90"></i>
                <span class="text-[10px] font-bold uppercase tracking-widest">App</span>
            </button>
            
            <!-- Chat Button -->
            <button id="footer-btn-chat" onclick="App.router('messenger')" class="flex-1 h-full rounded-full flex flex-col items-center justify-center gap-1 transition-all duration-300 relative z-10 group cursor-pointer">
                <i class="fa-solid fa-comments text-xl mb-1 transition-transform group-active:scale-90"></i>
                <span class="text-[10px] font-bold uppercase tracking-widest">Chat</span>
            </button>
        </div>

        <!-- Mobile Menu Drawer (Overlay for Sidebar Menu) -->
        <div id="mobile-menu" class="fixed inset-0 z-[110] pointer-events-none">
            <div id="mobile-menu-backdrop" onclick="App.toggleMobileMenu()" class="absolute inset-0 bg-black/80 backdrop-blur-sm opacity-0 transition-opacity duration-300"></div>
            <div id="mobile-menu-drawer" class="absolute right-0 top-0 h-full w-[85%] max-w-xs bg-dark-bg border-l border-white/10 shadow-2xl transform translate-x-full transition-transform duration-300 pointer-events-auto flex flex-col p-4">
                <div class="p-6 border-b border-white/5 flex items-center justify-between">
                    <span class="text-lg font-bold text-white tracking-tight">Navigation</span>
                    <button onclick="App.toggleMobileMenu()" class="w-9 h-9 rounded-full bg-dark-card flex items-center justify-center text-dark-muted hover:text-white transition-colors border border-white/5"><i class="fa-solid fa-times"></i></button>
                </div>
                <div class="flex-1 overflow-y-auto p-4 space-y-2">
                    <!-- User Profile Mobile -->
                    <div onclick="App.router('profile')" class="bg-gradient-to-r from-dark-card to-dark-bg p-4 rounded-2xl border border-white/5 flex items-center gap-4 mb-6 cursor-pointer active:scale-95 transition-transform shadow-lg">
                        <div class="w-12 h-12 rounded-full bg-brand-600 flex items-center justify-center text-white font-bold shadow-inner text-lg">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <div>
                            <p class="text-base font-bold text-white leading-tight" id="mobile-user-name">User</p>
                            <p class="text-xs text-brand-500 font-medium mt-0.5" id="mobile-user-role">Rolle</p>
                        </div>
                        <i class="fa-solid fa-chevron-right text-dark-muted ml-auto text-sm"></i>
                    </div>

                    <p class="text-[10px] font-bold text-dark-muted uppercase tracking-wider px-2 mb-2">Hauptmenü</p>
                    <button onclick="App.router('dashboard')" class="block w-full text-left p-3 rounded-xl text-dark-muted hover:text-white hover:bg-white/5 transition-colors flex items-center gap-3"><i class="fa-solid fa-house w-5 text-center"></i> Dashboard</button>
                    <button onclick="App.router('members')" class="block w-full text-left p-3 rounded-xl text-dark-muted hover:text-white hover:bg-white/5 transition-colors flex items-center gap-3"><i class="fa-solid fa-users w-5 text-center"></i> Mitglieder</button>
                    <button onclick="App.router('groups')" class="block w-full text-left p-3 rounded-xl text-dark-muted hover:text-white hover:bg-white/5 transition-colors flex items-center gap-3"><i class="fa-solid fa-layer-group w-5 text-center"></i> Gruppen</button>
                    <button onclick="App.router('calendar')" class="block w-full text-left p-3 rounded-xl text-dark-muted hover:text-white hover:bg-white/5 transition-colors flex items-center gap-3"><i class="fa-solid fa-calendar w-5 text-center"></i> Kalender</button>
                    <button onclick="App.router('news')" class="block w-full text-left p-3 rounded-xl text-dark-muted hover:text-white hover:bg-white/5 transition-colors flex items-center gap-3"><i class="fa-solid fa-newspaper w-5 text-center"></i> News</button>
                    <button onclick="App.router('workhours')" class="block w-full text-left p-3 rounded-xl text-dark-muted hover:text-white hover:bg-white/5 transition-colors flex items-center gap-3"><i class="fa-solid fa-briefcase w-5 text-center"></i> Stunden</button>
                    
                    <!-- Admin Link Mobile -->
                    <div id="mobile-admin-section" class="hidden pt-4">
                         <div class="h-px bg-white/10 mb-4"></div>
                         <button onclick="App.router('admin_roles')" class="block w-full text-left p-3 rounded-xl text-brand-500 bg-brand-500/10 hover:bg-brand-500/20 transition-colors flex items-center gap-3"><i class="fa-solid fa-shield-halved w-5 text-center"></i> Rechteverwaltung</button>
                    </div>
                </div>
                
                <div class="pt-4 border-t border-white/5 mt-2">
                    <button onclick="App.logout()" class="w-full py-3 rounded-xl border border-red-500/30 text-red-400 bg-red-500/5 hover:bg-red-500/10 font-bold transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-right-from-bracket"></i> Abmelden
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Modals & Toasts -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[150] hidden flex items-center justify-center p-4">
        <div class="glass border border-white/10 rounded-2xl shadow-2xl w-full max-w-md p-0 opacity-0 transition-all transform scale-95" id="modal-content"></div>
    </div>
    <div id="toast"></div>

    <!-- Load Scripts -->
    <script src="js/config.js"></script>
    <script src="js/store.js"></script>
    <script src="js/views/dashboard.js"></script>
    <script src="js/views/members.js"></script>
    <script src="js/views/groups.js"></script>
    <script src="js/views/calendar.js"></script>
    <script src="js/views/news.js"></script>
    <script src="js/views/documents.js"></script>
    <script src="js/views/messenger.js"></script>
    <script src="js/views/profile.js"></script>
    <script src="js/views/workhours.js"></script>
    <script src="js/views/admin_roles.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
