<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VereinsManager App</title>
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Design & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        dark: { bg: '#0f172a', card: '#1e293b', hover: '#334155', border: '#334155', text: '#f1f5f9', muted: '#94a3b8' }
                    },
                    borderRadius: { 'bubble': '2rem' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .bubble-card { background: linear-gradient(145deg, var(--card-color), var(--bg-color)); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); transition: all 0.3s; }
        .bubble-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2); }
        #toast { visibility: hidden; min-width: 250px; background-color: #3b82f6; color: #fff; text-align: center; border-radius: 12px; padding: 16px; position: fixed; z-index: 100; left: 50%; bottom: 30px; transform: translateX(-50%); transition: opacity 0.3s, bottom 0.3s; opacity: 0; }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-dark-bg text-dark-text selection:bg-blue-500 selection:text-white transition-colors duration-300">

    <!-- AUTH VIEW -->
    <div id="auth-view" class="h-screen flex items-center justify-center p-4 bg-[url('https://images.unsplash.com/photo-1526628953301-3e589a6a8b74?q=80&w=1920')] bg-cover bg-center relative">
        <div class="absolute inset-0 bg-dark-bg/90 backdrop-blur-sm"></div>
        <div class="relative z-10 w-full max-w-md bg-dark-card border border-dark-border p-8 rounded-bubble shadow-2xl fade-in">
            <div class="text-center mb-6">
                <div class="w-16 h-16 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-3xl text-white shadow-lg mx-auto mb-4"><i class="fa-solid fa-users-rectangle"></i></div>
                <h1 class="text-2xl font-bold text-white">VereinsManager</h1>
                <p class="text-dark-muted text-sm mt-2">Cloud Edition</p>
            </div>
            
            <div id="config-warning" class="hidden mb-4 p-3 bg-red-500/20 border border-red-500/50 rounded-xl text-red-200 text-xs text-center">
                <i class="fa-solid fa-triangle-exclamation mr-1"></i> Supabase Config fehlt in js/config.js!
            </div>

            <div class="mb-6 bg-dark-bg/50 p-4 rounded-xl border border-dark-border">
                <label class="block text-xs font-bold text-dark-muted uppercase mb-2 ml-1">Verein wählen</label>
                <select id="club-select" onchange="handleClubChange(this.value)" class="w-full bg-dark-card border border-dark-border rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 cursor-pointer">
                    <option value="demo">TSV Musterstadt (Demo)</option>
                    <option value="grokage">GroKaGe Malsch 1929 e.V.</option>
                    <option value="fc_beispiel">1. FC Beispielhausen</option>
                </select>
            </div>

            <form id="login-form" class="space-y-4">
                <div><label class="block text-xs font-bold text-dark-muted uppercase mb-1 ml-1">E-Mail</label><input type="email" name="email" required class="w-full bg-dark-bg border border-dark-border rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500"></div>
                <div><label class="block text-xs font-bold text-dark-muted uppercase mb-1 ml-1">Passwort</label><input type="password" name="password" required class="w-full bg-dark-bg border border-dark-border rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500"></div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg mt-2">Anmelden</button>
            </form>
            <div class="text-center mt-4"><p class="text-xs text-dark-muted">Admin-Login: <b>admin@gmail.com</b> / <b>admin</b></p></div>
        </div>
    </div>

    <!-- APP VIEW -->
    <div id="app-view" class="h-screen flex flex-col overflow-hidden hidden">
        <header class="bg-dark-card/50 backdrop-blur-md border-b border-dark-border h-20 flex items-center justify-between px-6 lg:px-10 z-20 shadow-sm sticky top-0 transition-colors duration-300">
            <button onclick="App.router('dashboard')" class="flex items-center group">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg mr-3 group-hover:scale-105 transition-transform"><i class="fa-solid fa-users-rectangle"></i></div>
                <div class="text-left"><h1 class="text-xl font-bold text-blue-500 tracking-tight leading-none group-hover:text-blue-400">VereinApp</h1><p id="page-subtitle" class="text-xs text-dark-muted font-medium">Dashboard</p></div>
            </button>
            <div class="flex items-center gap-3 sm:gap-6">
                <button onclick="App.router('workhours')" class="relative p-2 text-dark-muted hover:text-blue-400 transition-colors" title="Arbeitsstunden"><i class="fa-solid fa-briefcase text-xl"></i></button>
                <button onclick="App.router('messenger')" class="relative p-2 text-dark-muted hover:text-blue-400 transition-colors" title="Messenger"><i class="fa-solid fa-comments text-xl"></i></button>
                <button onclick="App.toggleNotifications()" class="relative p-2 text-dark-muted hover:text-blue-400 transition-colors" title="Benachrichtigungen"><i class="fa-regular fa-bell text-xl"></i><span id="notif-dot" class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-dark-card animate-pulse hidden"></span></button>
                <button onclick="App.openSettingsModal()" class="relative p-2 text-dark-muted hover:text-blue-400 transition-colors" title="Einstellungen"><i class="fa-solid fa-gear text-xl"></i></button>
                <button onclick="App.router('profile')" class="flex items-center gap-3 pl-6 border-l border-dark-border group">
                    <div class="text-right hidden sm:block"><p id="current-user-name" class="text-sm font-bold text-dark-text group-hover:text-blue-400">Gast</p><p id="current-user-role" class="text-xs text-dark-muted">Mitglied</p></div>
                    <div class="w-10 h-10 rounded-full bg-slate-700 overflow-hidden border-2 border-transparent group-hover:border-blue-500 transition-colors"><div class="w-full h-full flex items-center justify-center bg-slate-800 text-slate-400"><i class="fa-solid fa-user"></i></div></div>
                </button>
            </div>
        </header>
        <div id="content" class="flex-1 overflow-y-auto p-4 lg:p-10 relative max-w-7xl mx-auto w-full transition-colors duration-300"></div>
    </div>

    <div id="modal-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 transition-opacity duration-300"><div class="bg-dark-card border border-dark-border rounded-bubble shadow-2xl w-full max-w-md transform transition-all scale-95 opacity-0 text-dark-text" id="modal-content"></div></div>
    <div id="toast">Nachricht gesendet</div>

    <!-- 1. Config & Store -->
    <script src="js/config.js"></script>
    <script src="js/store.js"></script>
    
    <!-- 2. Views -->
    <script src="js/views/dashboard.js"></script>
    <script src="js/views/members.js"></script>
    <script src="js/views/groups.js"></script>
    <script src="js/views/calendar.js"></script>
    <script src="js/views/news.js"></script>
    <script src="js/views/documents.js"></script>
    <script src="js/views/profile.js"></script>
    <script src="js/views/messenger.js"></script>
    <script src="js/views/workhours.js"></script>

    <!-- 3. App Core -->
    <script src="js/app.js"></script>

</body>
</html>
