<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VereinsManager App</title>
    
    <!-- ERROR LOGGER: Zeigt Fehler direkt auf dem Screen an -->
    <script>
        window.onerror = function(msg, url, line, col, error) {
            const errorBox = document.getElementById('debug-error-box');
            if(errorBox) {
                errorBox.style.display = 'block';
                errorBox.innerHTML += `<div class="mb-2">❌ <b>Fehler:</b> ${msg}<br><span class="text-xs opacity-75">${url.split('/').pop()}:${line}</span></div>`;
            }
            return false;
        };
        // Prüfen ob Dateien geladen werden
        window.addEventListener('DOMContentLoaded', () => {
            const files = ['js/config.js', 'js/store.js', 'js/app.js'];
            setTimeout(() => {
                // Check ob Objekte da sind
                if(typeof CONFIG === 'undefined') window.onerror('config.js wurde nicht geladen! Pfad prüfen.', 'index.html', 0);
                if(typeof Store === 'undefined') window.onerror('store.js wurde nicht geladen! Pfad prüfen.', 'index.html', 0);
                if(typeof App === 'undefined') window.onerror('app.js wurde nicht geladen oder hat Syntax-Fehler!', 'index.html', 0);
            }, 1000);
        });
    </script>

    <!-- Externe Libs -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { dark: { bg: '#0f172a', card: '#1e293b', border: '#334155', text: '#f1f5f9', muted: '#94a3b8' } }, borderRadius: { 'bubble': '2rem' } } }
        }
    </script>
    
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: white; }
        .bubble-card { background: #1e293b; border-radius: 2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .fade-in { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Toast */
        #toast { visibility: hidden; min-width: 250px; background-color: #3b82f6; color: #fff; text-align: center; border-radius: 12px; padding: 16px; position: fixed; z-index: 100; left: 50%; bottom: 30px; transform: translateX(-50%); opacity: 0; transition: 0.3s; }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
    </style>
</head>
<body class="bg-dark-bg text-dark-text">

    <!-- DEBUG BOX: Erscheint nur bei Fehlern -->
    <div id="debug-error-box" class="hidden fixed top-0 left-0 w-full bg-red-900/90 text-white p-4 z-[9999] border-b-2 border-red-500 font-mono text-sm">
        <h3 class="font-bold border-b border-red-400 mb-2 pb-1">⚠️ DEBUG KONSOLE (Fehler gefunden)</h3>
        <!-- Fehler erscheinen hier -->
    </div>

    <!-- AUTH VIEW -->
    <div id="auth-view" class="h-screen flex items-center justify-center p-4 relative">
        <div class="absolute inset-0 bg-dark-bg z-0"></div>
        <div class="relative z-10 w-full max-w-md bg-dark-card border border-dark-border p-8 rounded-bubble shadow-2xl fade-in">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-white">VereinsManager</h1>
                <p class="text-dark-muted text-sm mt-2">Login</p>
            </div>
            
            <form id="login-form" onsubmit="event.preventDefault(); if(typeof App !== 'undefined') { App.handleLogin(event); } else { alert('FEHLER: App.js wurde nicht geladen. Siehe rote Box oben.'); } return false;" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-dark-muted uppercase mb-1 ml-1">E-Mail</label>
                    <input type="email" name="email" required placeholder="admin@gmail.com" class="w-full bg-dark-bg border border-dark-border rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-dark-muted uppercase mb-1 ml-1">Passwort</label>
                    <input type="password" name="password" required placeholder="admin" class="w-full bg-dark-bg border border-dark-border rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg mt-2">Anmelden</button>
            </form>
            <div id="login-error" class="text-red-400 text-xs text-center mt-3 hidden"></div>
        </div>
    </div>

    <!-- APP VIEW -->
    <div id="app-view" class="h-screen flex flex-col hidden">
        <header class="bg-dark-card border-b border-dark-border h-16 flex items-center justify-between px-6">
            <h1 class="font-bold text-blue-500">VereinsApp</h1>
            <button onclick="App.logout()" class="text-red-400 text-sm">Logout</button>
        </header>
        <div id="content" class="flex-1 p-6 overflow-y-auto"></div>
    </div>
    
    <div id="toast">Nachricht</div>

    <!-- WICHTIG: SKRIPTE -->
    <!-- Wenn diese Pfade falsch sind, erscheint oben die rote Box -->
    <script src="js/config.js"></script>
    <script src="js/store.js"></script>
    
    <!-- Views -->
    <script src="js/views/dashboard.js"></script>
    <!-- (Füge hier deine anderen Views hinzu wenn nötig) -->

    <script src="js/app.js"></script>

</body>
</html>
