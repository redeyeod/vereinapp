<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VereinsManager</title>
    
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { bg: '#0f172a', card: '#1e293b', border: '#334155', text: '#f1f5f9', muted: '#94a3b8' }
                    },
                    borderRadius: { 'bubble': '1.5rem' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        #toast { visibility: hidden; min-width: 250px; background-color: #2563eb; color: #fff; text-align: center; border-radius: 8px; padding: 12px; position: fixed; z-index: 100; left: 50%; bottom: 30px; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s; }
        #toast.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="auth-view" class="h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-dark-card border border-dark-border p-8 rounded-bubble shadow-2xl">
            <div class="text-center mb-6">
                <i class="fa-solid fa-users-rectangle text-4xl text-blue-500 mb-2"></i>
                <h1 class="text-xl font-bold">VereinsManager</h1>
            </div>
            
            <div class="mb-4">
                <label class="text-xs text-dark-muted uppercase font-bold">Verein</label>
                <select id="club-select" class="w-full bg-dark-bg border border-dark-border rounded-lg p-2 text-white mt-1">
                    <option value="demo">TSV Musterstadt</option>
                    <option value="grokage">GroKaGe Malsch</option>
                </select>
            </div>

            <form onsubmit="App.handleLogin(event)" class="space-y-4">
                <div>
                    <label class="text-xs text-dark-muted uppercase font-bold">Email</label>
                    <input type="email" name="email" required class="w-full bg-dark-bg border border-dark-border rounded-lg p-2 text-white mt-1 focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="text-xs text-dark-muted uppercase font-bold">Passwort</label>
                    <input type="password" name="password" required class="w-full bg-dark-bg border border-dark-border rounded-lg p-2 text-white mt-1 focus:border-blue-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg transition-colors">Anmelden</button>
            </form>
            <div id="login-error" class="text-red-400 text-xs text-center mt-3 hidden"></div>
        </div>
    </div>

    <!-- 2. APP SCREEN -->
    <div id="app-view" class="h-screen flex flex-col hidden">
        <!-- Header -->
        <header class="h-16 border-b border-dark-border flex items-center justify-between px-4 bg-dark-card sticky top-0 z-20">
            <div class="flex items-center gap-3 cursor-pointer" onclick="App.router('dashboard')">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white"><i class="fa-solid fa-users"></i></div>
                <span class="font-bold hidden sm:block">VereinsManager</span>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="App.router('workhours')" title="Arbeitsstunden" class="text-dark-muted hover:text-white"><i class="fa-solid fa-briefcase"></i></button>
                <button onclick="App.router('messenger')" title="Messenger" class="text-dark-muted hover:text-white"><i class="fa-solid fa-comments"></i></button>
                <button onclick="App.toggleNotifications()" class="relative text-dark-muted hover:text-white">
                    <i class="fa-regular fa-bell"></i>
                    <span id="notif-dot" class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full hidden"></span>
                </button>
                <button onclick="App.router('profile')" class="w-8 h-8 bg-slate-700 rounded-full flex items-center justify-center text-white text-xs border border-dark-border">
                    <i class="fa-solid fa-user"></i>
                </button>
            </div>
        </header>

        <!-- Content -->
        <div id="content" class="flex-1 overflow-y-auto p-4 md:p-6 max-w-7xl mx-auto w-full"></div>
    </div>

    <!-- 3. OVERLAYS -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-dark-card border border-dark-border rounded-xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto" id="modal-content"></div>
    </div>
    <div id="notification-overlay" class="hidden fixed top-16 right-4 w-80 bg-dark-card border border-dark-border rounded-xl shadow-2xl z-50 overflow-hidden"></div>
    <div id="toast">Info</div>

    <!-- 4. SCRIPTS (Reihenfolge ist Pflicht!) -->
    <script src="js/config.js"></script>
    <script src="js/store.js"></script>
    
    <script src="js/views/dashboard.js"></script>
    <script src="js/views/members.js"></script>
    <script src="js/views/groups.js"></script>
    <script src="js/views/calendar.js"></script>
    <script src="js/views/news.js"></script>
    <script src="js/views/documents.js"></script>
    <script src="js/views/profile.js"></script>
    <script src="js/views/messenger.js"></script>
    <script src="js/views/workhours.js"></script>

    <script src="js/app.js"></script>
</body>
</html>
